  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d14;color:#fff;
    font-family:"YujiSyuku","Hiragino Mincho ProN","Yu Mincho",serif;user-select:none}
  b,strong,h1,button,.act{font-weight:400 !important}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none !important}
  .hud{position:fixed;pointer-events:none}
  #vignette{inset:0;transition:box-shadow .25s}
  #vignette.look{box-shadow:inset 0 0 160px 50px rgba(255,0,0,.5)}
  #vignette.warn{box-shadow:inset 0 0 120px 24px rgba(255,190,0,.35)}
  #vignette.near{box-shadow:inset 0 -140px 120px -60px rgba(255,0,0,.75)}
  #topHud{top:8px;left:50%;transform:translateX(-50%);width:min(620px,62vw);text-align:center;text-shadow:0 1px 4px #000;background:rgba(8,10,18,.92);padding:6px 14px 10px;border-radius:10px;box-sizing:border-box}
  #hpLabel{font-size:14px;font-weight:700}
  .bar{height:10px;background:#ffffff22;border-radius:5px;overflow:hidden;margin:4px 0}
  #hpFill{height:100%;background:#e8402f}
  #stateText{font-size:15px;font-weight:800;margin-top:4px}
  #stateFill{height:100%}
  /* 通路の全体図：壁・自分・ダルマの位置 */
  #track{position:relative;height:22px;margin-top:8px;background:#1c2233;border:1px solid #3a4366;border-radius:6px;overflow:hidden}
  #trackWall{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(-45deg,#a0141c 0 6px,#7a0a10 6px 12px)}
  #trackWall::after{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:#ff4040}
  #trackMe{position:absolute;top:2px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#3b82f6;border:2px solid #fff;box-sizing:border-box;font-size:9px;line-height:12px;text-align:center;font-weight:800}
  #trackDaruma{position:absolute;right:3px;top:2px;width:16px;height:16px;border-radius:50%;background:#c8202a;border:2px solid #fff;box-sizing:border-box}
  #trackLabel{position:absolute;left:6px;top:2px;font-size:11px;font-weight:800;color:#fff}
  #info{top:10px;left:12px;font-size:15px;line-height:1.75;background:rgba(8,10,18,.92);padding:8px 12px;border-radius:8px}
  #info b{color:#ffd36b}
  #info .danger{color:#ff6b6b}
  #info img{width:18px;height:24px;vertical-align:-6px;margin-left:4px}
  #msg{left:0;right:0;top:40%;transform:translateY(-50%);font-size:clamp(36px,5.2vw,64px);font-weight:400;text-align:center;white-space:pre-line;line-height:1.25;padding:10px 0;
    background:linear-gradient(90deg,#0000,#0008 20%,#0008 80%,#0000);-webkit-text-stroke:2px #000;paint-order:stroke fill;
    text-shadow:0 2px 10px #000,0 0 2px #000}
  #handBar{position:fixed;left:0;right:0;bottom:0;height:136px;display:flex;align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(#0000,#000a 35%)}
  #foot{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#ffd36b;font-weight:700}
  #foot img{width:58px;height:77px;border-radius:5px;box-shadow:0 0 0 3px #ffd36b,0 4px 10px #000a;margin-top:3px}
  #foot .none{width:58px;height:77px;border-radius:5px;border:2px dashed #ffd36b88;margin-top:3px;display:flex;align-items:center;justify-content:center;color:#ffd36b99}
  #hand{display:flex;gap:3px;align-items:flex-end}
  #hand img{width:52px;height:69px;border-radius:5px;cursor:default;transition:transform .08s;box-shadow:0 3px 6px #0008}
  #hand img.sel{transform:translateY(-12px);box-shadow:0 0 0 3px #ffcc33,0 6px 10px #000a}
  #hand img.dora{box-shadow:0 0 0 3px #e0a800,0 3px 6px #0008}
  #hand img.sel.dora{box-shadow:0 0 0 3px #ffcc33,0 0 0 6px #e0a800,0 6px 10px #000a}
  #hand img.tsumo{margin-left:14px}
  #hand .empty{width:52px;height:69px;border-radius:5px;border:2px dashed #fff5;margin-left:14px}
  #buttons{display:flex;flex-direction:column;gap:6px}
  .act{font-family:inherit;font-size:13px;font-weight:800;color:#fff;border:none;border-radius:7px;padding:7px 12px;cursor:pointer;min-width:118px}
  #winBtn{background:#555}
  #winBtn.on{background:#d89b00;animation:glow .6s infinite alternate}
  @keyframes glow{to{box-shadow:0 0 14px #ffcc33}}
  #moiBtn{background:#3a4366}
  #viewBtn{background:#2b3a2b;font-size:20px;padding:4px 10px}
  #keys{position:fixed;left:12px;bottom:136px;font-size:15px;line-height:1.7;background:rgba(8,10,18,.92);padding:6px 10px;border-radius:8px}
  #keys b{display:inline-block;min-width:54px;color:#ffd36b}
  #hand img:hover{transform:translateY(-8px)}
  #mapBox{position:fixed;top:10px;right:12px;background:rgba(8,10,18,.92);padding:8px;border-radius:10px;text-align:center;pointer-events:none}
  #mm{display:block}
  #mapLegend{font-size:11px;margin-top:5px;line-height:1.5}
  #mapLegend span{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 6px;vertical-align:-1px}
  .recWrap{position:relative;display:inline-block}
  .recTag{position:absolute;left:50%;top:-20px;transform:translateX(-50%);background:#ff9f43;color:#000;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;white-space:nowrap;pointer-events:none}
  .recWrap img{box-shadow:0 0 0 3px #ff9f43,0 3px 6px #0008 !important}
  #tutBox .ti{width:24px;height:32px;vertical-align:middle;margin-right:2px;border-radius:3px}
  #tutBox .row{display:inline-block;min-width:82px}
  #tutBox small{color:#b8c8ec}
  #hint{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);font-size:17px;background:rgba(0,0,0,.85);padding:5px 14px;border-radius:6px;white-space:nowrap}
  #tutBox{position:fixed;left:12px;top:64px;width:350px;pointer-events:auto;background:rgba(10,30,70,.95);border:1px solid #3b82f6;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.65}
  #tutStep{font-size:12px;color:#9cc3ff;font-weight:700}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,12,.86);z-index:10;padding:16px;box-sizing:border-box}
  .panel{max-width:900px;max-height:100%;overflow:auto;padding:24px 28px;background:#161a26;border:1px solid #2f3756;border-radius:14px;line-height:1.7;box-sizing:border-box}
  .panel h1{font-size:46px;margin:0 0 6px}
  .tag{display:inline-block;font-size:12px;background:#333b5c;padding:1px 8px;border-radius:10px;margin-bottom:8px}
  .modes{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
  .mode{flex:1 1 150px;text-align:left;padding:12px 14px;border-radius:10px;border:2px solid #2f3756;background:#1e2436;color:#fff;cursor:pointer;font-family:inherit;line-height:1.5}
  .mode:hover{border-color:#ffd36b;background:#262d44}
  .mode.tutorial{flex-basis:100%;border-color:#1e5aa8}
  .mode b{font-size:24px;display:block;white-space:nowrap}
  .lv{display:inline-block;font-size:15px;padding:0 8px;border-radius:9px;margin:2px 0 4px;font-weight:700}
  .lv.tut{background:#1565c0}.lv.easy{background:#2e7d32}.lv.normal{background:#c77700}.lv.hard{background:#b71c1c}
  .mode small{display:block;color:#dfe4f2;font-size:17px}
  table{border-collapse:collapse;font-size:13.5px;width:100%}
  td{padding:2px 8px;border-bottom:1px solid #262c44}
  td:first-child{color:#ffd36b;white-space:nowrap;width:170px}
  .btn{display:inline-block;margin-top:12px;padding:10px 26px;font-size:16px;font-weight:800;color:#fff;background:#d33;border:none;border-radius:8px;cursor:pointer;font-family:inherit}
  .btn.sub{background:#3a4366;margin-left:8px}
  #resultTitle{font-size:34px;margin:0 0 6px;font-weight:800}
  .credit{font-size:11px;color:#8890a8;margin-top:10px}
  #err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}

// ===== 上がり判定・役 =====
function canMentsu(c, i, seq) {
  while (i < 34 && c[i] === 0) i++;
  if (i === 34) return true;
  if (c[i] >= 3) { c[i] -= 3; const ok = canMentsu(c, i, seq); c[i] += 3; if (ok) return true; }
  if (seq && i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
    c[i]--; c[i + 1]--; c[i + 2]--; const ok = canMentsu(c, i, seq); c[i]++; c[i + 1]++; c[i + 2]++;
    if (ok) return true;
  }
  return false;
}
function isStandard(c, seq) {
  for (let i = 0; i < 34; i++) { if (c[i] < 2) continue; c[i] -= 2; const ok = canMentsu(c, 0, seq); c[i] += 2; if (ok) return true; }
  return false;
}
function isChiitoi(c) { let p = 0; for (let i = 0; i < 34; i++) { if (c[i] === 2) p++; else if (c[i] !== 0) return false; } return p === 7; }
function evaluate(tiles, dora) {
  const c = new Array(34).fill(0); tiles.forEach(t => c[t]++);
  const std = isStandard(c, true), chi = isChiitoi(c);
  if (!std && !chi) return null;
  const base = [['ツモ', 1]];
  if (tiles.every(t => t % 9 >= 1 && t % 9 <= 7)) base.push(['タンヤオ', 1]);
  if (tiles.every(t => suit(t) === suit(tiles[0]))) base.push(['清一色', 6]);
  let best = null;
  const consider = l => { const han = l.reduce((a, y) => a + y[1], 0); if (!best || han > best.han) best = {han, yaku: l}; };
  if (std) { const l = base.slice(); if (isStandard(c, false)) l.push(['対々和', 2]); consider(l); }
  if (chi) consider(base.concat([['七対子', 2]]));
  const d = tiles.filter(t => t === dora).length;
  if (d > 0) { best.yaku = best.yaku.concat([['ドラ' + d, d]]); best.han += d; }
  return best;
}

// ===== 手牌 =====

function discard(i) {

  else { G.hand.splice(i, 1); G.hand.push(G.drawn); G.hand.sort((a, b) => a - b); G.drawn = null; }

function declareWin() {

}

function tutEvent(ev) {

// 説明を読んでいる間（「次へ」のステップ）はダルマも壁も止めておく

// ===== ヒント（あと何枚・ほしい牌・捨てるといい牌） =====
// 向聴数（シャンテン数）：あと何枚入れ替えれば「あと1枚で上がり」になるか。-1 = 上がり
function shantenStd(c) {
  let best = 8;
  (function rec(i, m, t, p) {
    while (i < 27 && c[i] === 0) i++;
    if (i >= 27) { const s = 8 - 2 * m - Math.min(t, 4 - m) - p; if (s < best) best = s; return; }
    if (c[i] >= 3) { c[i] -= 3; rec(i, m + 1, t, p); c[i] += 3; }
    if (i % 9 <= 6 && c[i + 1] && c[i + 2]) { c[i]--; c[i + 1]--; c[i + 2]--; rec(i, m + 1, t, p); c[i]++; c[i + 1]++; c[i + 2]++; }
    if (!p && c[i] >= 2) { c[i] -= 2; rec(i, m, t, 1); c[i] += 2; }
    if (m + t < 4) {
      if (c[i] >= 2) { c[i] -= 2; rec(i, m, t + 1, p); c[i] += 2; }
      if (i % 9 <= 7 && c[i + 1]) { c[i]--; c[i + 1]--; rec(i, m, t + 1, p); c[i]++; c[i + 1]++; }
      if (i % 9 <= 6 && c[i + 2]) { c[i]--; c[i + 2]--; rec(i, m, t + 1, p); c[i]++; c[i + 2]++; }
    }
    c[i]--; rec(i, m, t, p); c[i]++;
  })(0, 0, 0, 0);
  return best;
}
function shanten(tiles) {
  const c = new Array(34).fill(0); tiles.forEach(t => c[t]++);
  let pairs = 0, kinds = 0;
  for (let i = 0; i < 27; i++) { if (c[i] >= 2) pairs++; if (c[i] > 0) kinds++; }
  const chi = 6 - pairs + Math.max(0, 7 - kinds);
  return Math.min(shantenStd(c), chi);
}
// 13枚の手で、引くと向聴数が下がる牌の種類
function usefulTiles(hand13) {
  const s = shanten(hand13), set = new Set();
  for (let t = 0; t < 27; t++) {
    if (hand13.filter(x => x === t).length >= 4) continue;
    if (shanten(hand13.concat([t])) < s) set.add(t);
  }
  return {s, set};
}
let hintsOn = false;
// ほしい牌が多すぎると光りすぎるので、引いた後にさらに伸びる牌を上位6種類だけに絞る
const hintCache = new Map();
function narrowUseful(hand13, u) {
  if (u.set.size <= 6 || u.s <= 0) return u.set;
  const key = hand13.slice().sort((x, y) => x - y).join(',');
  if (hintCache.has(key)) return hintCache.get(key);
  const sc = [];
  for (const t of u.set) {
    const h14 = hand13.concat([t]); let best = 0;
    for (let i = 0; i < 14; i++) {
      if (h14.indexOf(h14[i]) !== i) continue;
      const rest = h14.slice(0, i).concat(h14.slice(i + 1));
      const v = usefulTiles(rest); if (v.s < u.s && v.set.size > best) best = v.set.size;
    }
    sc.push([t, best]);
  }
  sc.sort((p, q) => q[1] - p[1]);
  const res = new Set(sc.slice(0, 6).map(p => p[0]));
  if (hintCache.size > 50) hintCache.clear();
  hintCache.set(key, res); return res;
}
function updateHints() {
  G.recIdx = -1; G.useful = new Set(); G.shanten = null;
  if (!hintsOn && G.drawn === null) return;   // 捨てる牌の計算は自動捨てのため常に行う
  if (G.drawn === null) {
    const u = usefulTiles(G.hand); G.useful = narrowUseful(G.hand, u); G.shanten = u.s;
  } else {
    const all = full();
    let best = null;
    for (let i = 0; i < all.length; i++) {
      if (i > 0 && i < 13 && all[i] === all[i - 1]) continue;    // 同じ牌はまとめて判定
      const rest = all.slice(0, i).concat(all.slice(i + 1));
      const u = usefulTiles(rest);
      const score = u.s * 100 - u.set.size;
      if (!best || score < best.score) best = {score, i, u};
    }
    G.recIdx = best.i; G.useful = new Set(); G.shanten = best.u.s;
  }
}

// ===== 手牌の表示 =====
function renderHand() {
  updateHints();
  const h = $('hand');
  h.innerHTML = '';
  const add = (t, i, extra) => {
    const im = document.createElement('img');
    im.src = TILE_SRC[t]; im.dataset.i = i; im.draggable = false;
    im.className = (i === G.sel ? 'sel ' : '') + (t === G.dora ? 'dora ' : '') + (extra || '');
    im.title = tileName(t) + (t === G.dora ? '（ドラ）' : '');
    if (i === G.recIdx && !G.win) {
      const w = document.createElement('div'); w.className = 'recWrap';
      w.appendChild(im); const tag = document.createElement('span'); tag.className = 'recTag'; tag.textContent = '捨て';
      w.appendChild(tag); h.appendChild(w);
    } else h.appendChild(im);
  };
  G.hand.forEach((t, i) => add(t, i));
  if (G.drawn !== null) add(G.drawn, 13, 'tsumo');
  else { const e = document.createElement('div'); e.className = 'empty'; h.appendChild(e); }
  const wb = $('winBtn');
  wb.className = 'act' + (G.win ? ' on' : '');
  wb.textContent = G.win ? '上がり！ ' + G.win.han + '翻（Space）' : '上がり（Space）';
  $('moiBtn').textContent = 'もういいや（残り' + (G.moiiya > 50 ? '∞' : G.moiiya) + '回）';
  $('hintBtn').textContent = 'ヒント：' + (hintsOn ? 'ON' : 'OFF');
}

// ===== 入力 =====
const keys = {};
// WASD で移動（日本語入力ONでも効くよう e.code で判定）
const DIRS = {keya: [0, -1], keyd: [0, 1], keyw: [1, 0], keys: [-1, 0]};
window.addEventListener('keydown', e => {
  const k = e.code.startsWith('Key') ? e.code.toLowerCase() : e.key.toLowerCase();
  if ([' ', 'keyw', 'keya', 'keys', 'keyd'].includes(k)) e.preventDefault();
  if (!running) return;
  if (DIRS[k] && !keys[k]) { keys[k] = true; tryStep(DIRS[k]); G.stepCool = STEP_REPEAT * 1.8; return; }
  keys[k] = true;
  if (e.repeat) return;
  if (k === ' ') declareWin();
});

// d = [前後（＋でダルマ側）, 左右（＋で右）]
function tryStep(d) {
  const nx = G.cx + d[0], ny = G.cy + d[1];
  if (ny < 0 || ny >= ROWS || nx > COLS - 1) return;
  if (nx - G.wallX - 1 < 0) return;                    // 壁の中には入れない
  G.cx = nx; G.cy = ny; G.moved++;
  if (G.moved >= 3) tutEvent('move');
  if (G.state === 'look' && G.stateT > GRACE && !G.foundThisLook) {
    G.foundThisLook = true; G.found++; G.wallX += M.wallPenalty;
    flash(M.wallPenalty > 0 ? '見つかった！\n締め切りが' + M.wallPenalty + 'マス迫る' : '見つかった！\n（練習なので壁は動かない）', '#ff5a5a', 1.6);
  }
}

// ===== ダルマの進行 =====
const nextBack = () => M.backMin + Math.random() * (M.backMax - M.backMin);
function stepDaruma(dt) {
  G.stateT += dt;
  if (G.state === 'back' && G.stateT >= G.stateDur && G.quickNext) {
    G.quickNext = false; G.state = 'look'; G.stateT = 0; G.foundThisLook = false;
    flash('……と思ったら、もう一回！', '#ff8a8a', 1.3); lookTsumo(); swapFloor();
  } else if (G.state === 'back' && G.stateT >= G.stateDur) {
    // 「もうすぐ振り向く」の合図はなし。いきなり振り向く
    if (tutSetupActive()) tutSeed();
    G.state = 'look'; G.stateT = 0; G.foundThisLook = false; lookTsumo(); swapFloor();
  } else if (G.state === 'look' && G.stateT >= M.look) {
    G.state = 'back'; G.stateT = 0; G.stateDur = nextBack();
    if (M.quick > 0 && Math.random() < M.quick) { G.quickNext = true; G.stateDur = 1.0; }
    if (!G.foundThisLook) tutEvent('safeLook');
  }
}

  x.fillStyle = '#7a0a10'; x.fillRect(0, 0, w, h);

function updateDom() {

    if (tl) f.outerHTML = '<img id="footImg" data-k="' + want + '" src="' + TILE_SRC[tl.type] + '" title="' + tileName(tl.type) + '">';
    else f.outerHTML = '<div class="none" id="footImg" data-k="none">なし</div>';
  }
  const left = '';
  $('hint').textContent = G.win ? '上がり！ 攻撃中（' + G.win.han + '翻）'
    : G.drawn !== null ? 'いらない牌を自動で捨てるよ'
    : left + (hintsOn ? '緑に光る牌の上で、振り向きを待とう' : '欲しい牌の上に立って待とう。振り向いた瞬間の足元の牌がツモになる');

  $('hpLabel').textContent = M.name + '｜' + M.daruma + ' HP ' + G.hp + ' / ' + M.hp;
  $('hpFill').style.width = (G.hp / M.hp * 100) + '%';
  let st, sc, ratio;
  if (G.state === 'back') { st = ''; sc = '#7ee08a'; ratio = 1 - G.stateT / G.stateDur; }
  else if (G.state === 'warn') { st = '合図中…もうすぐ振り向く！'; sc = '#ffd36b'; ratio = 1 - G.stateT / M.warn; }
  else { st = '振り向き中！ 動くな　あと ' + Math.max(0, M.look - G.stateT).toFixed(1) + ' 秒'; sc = '#ff6b6b'; ratio = 1 - G.stateT / M.look; }

  // 通路の全体図（左端 = 壁の初期位置、右端 = ダルマ）
  const lo = WALL_START, hi = COLS + 2;
  const pct = x => Math.max(0, Math.min(100, (x - lo) / (hi - lo) * 100));
  $('trackWall').style.width = pct(G.wallX + 1) + '%';
  $('trackMe').style.left = pct(G.cx + 0.5) + '%';
  $('trackDaruma').style.background = G.state === 'look' ? '#ff2020' : M.color;

  const dist = Math.max(0, G.cx - G.wallX - 1), t = Math.floor(G.time);

  let text = '', col = '#fff';
  if (G.time < G.msgUntil) { text = G.msg; col = G.msgColor; }
  else if (G.state === 'warn') { text = M.warnText; col = '#ffd36b'; }
  else if (G.state === 'look') { text = M.lookText; col = '#ffdb33'; }
  $('msg').textContent = text; $('msg').style.color = col;
  $('vignette').className = 'hud' + (G.state === 'look' ? ' look' : G.state === 'warn' ? ' warn' : dist < 1.5 ? ' near' : '');
}

      if (img.complete) mg.drawImage(img, x + 2, y + 2, MCW - 4, MCH - 4);
      if (f.type === G.dora) { mg.strokeStyle = '#e0a800'; mg.lineWidth = 3; mg.strokeRect(x + 2, y + 2, MCW - 4, MCH - 4); }
      if (hintsOn && G.useful && G.useful.has(f.type)) { mg.strokeStyle = '#3ddc5a'; mg.lineWidth = 4; mg.strokeRect(x + 3, y + 3, MCW - 6, MCH - 6); }
      if (f.flash > G.time) { mg.fillStyle = 'rgba(255,210,110,.45)'; mg.fillRect(x + 2, y + 2, MCW - 4, MCH - 4); }
      if (c <= G.wallX + 1 - 0.5) { mg.fillStyle = 'rgba(200,20,30,.6)'; mg.fillRect(x + 2, y + 2, MCW - 4, MCH - 4); }
    }
  }
  // 足元（真ん中）：太い黄色の枠
  const fx = 4 + MCW, fy = 4 + MCH;
  mg.strokeStyle = '#ffd36b'; mg.lineWidth = 5; mg.strokeRect(fx, fy, MCW, MCH);
  mg.fillStyle = '#ffd36b'; mg.fillRect(fx, fy + MCH - 14, MCW, 14);
  mg.fillStyle = '#000'; mg.font = 'bold 11px sans-serif'; mg.fillText('足元', fx + MCW / 2, fy + MCH - 7);
}

// ===== ループ =====
reset();
G.px = cellX(G.cy); G.pz = cellZ(G.cx);
const camPos = new THREE.Vector3(0, 1.9, 1.2), camLook = new THREE.Vector3(0, 0.3, -6);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) || 0.016; last = now;
  if (running) {
    if (!tutPaused()) G.time += dt;
    G.stepCool -= dt;
    if (G.stepCool <= 0) for (const k in DIRS) if (keys[k]) { tryStep(DIRS[k]); G.stepCool = STEP_REPEAT; break; }
    if (!tutPaused()) { stepDaruma(dt); G.wallX += M.wallSpeed * dt; }
    if (G.cx - G.wallX - 1 <= -0.3) end(false);
  }
  updateDom();

  const looking = running && G.state === 'look', warning = running && G.state === 'warn';
  // 牌：画像・ドラ・入れ替え・チュートリアルの光
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    const f = floor[c][r], tm = tileMeshes[c][r];
    if (tm.type !== f.type) { tm.type = f.type; tm.top.map = TEX[f.type]; tm.top.needsUpdate = true; }
    let em = 0x000000;
    if (f.flash > G.time) em = 0x664400;
    else if ((tutSetupActive() && TUT_WIN.includes(f.type)) || (hintsOn && G.useful && G.useful.has(f.type))) em = 0x1f8a30;
    else if (f.type === G.dora) em = 0x4a3500;
    tm.top.emissive.setHex(em);
  }
  // 自分と足元の枠（なめらかに移動）
  G.px += (cellX(G.cy) - G.px) * 0.3; G.pz += (cellZ(G.cx) - G.pz) * 0.3;
  footFrame.position.set(G.px, 0, G.pz);
  footFrame.visible = G.cx >= 0;
  me.position.set(G.px - CX * 0.32, 0, G.pz + CZ * 0.32);
  // ダルマ
  daruma.rotation.y += ((looking ? 0 : Math.PI) - daruma.rotation.y) * Math.min(1, dt * 5);
  daruma.position.x = G.time < G.shakeUntil ? Math.sin(G.time * 60) * 0.25 : 0;
  eyes.forEach(e => { e.visible = looking; });
  glare.intensity += ((looking ? 2.8 + Math.sin(now / 90) * 0.4 : 0) - glare.intensity) * 0.15;
  const fogTarget = looking ? FOG_LOOK : warning ? FOG_WARN : FOG_NORMAL;
  scene.fog.color.lerp(fogTarget, 0.08); scene.background.lerp(fogTarget, 0.08);
  // 壁：前面の位置 = 壁の右端（WallX + 1 マス）
  const frontZ = -(G.wallX + 1) * CZ;
  wall.position.set(0, 1.2, frontZ + WALL_DEPTH / 2);
  wallEdge.position.set(0, 2.45, frontZ);
  const dist = G.cx - G.wallX - 1;
  edgeMat.color.setHex(dist < 2 && Math.sin(now / 70) > 0 ? 0xffffff : 0xff4040);
  // カメラ
  const v = VIEWS[view];
  me.visible = !v.fp;
  if (v.fp) {
    // 一人称：自分の目の高さから、ダルマの方向（前）を見る。少し下を向いて足元の近くも見える
    // マウスのドラッグで見回せる（yaw=左右, pitch=上下）
    camPos.lerp(new THREE.Vector3(G.px, 1.9, G.pz + 0.35), 0.25);
    const p = -0.21 + lookPitch;
    camLook.set(camPos.x - Math.sin(lookYaw) * Math.cos(p) * 8, camPos.y + Math.sin(p) * 8, camPos.z - Math.cos(lookYaw) * Math.cos(p) * 8);
  } else {
    const tx = G.px * 0.6;
    camPos.lerp(new THREE.Vector3(tx, v.height, G.pz + v.back), 0.08);
    camLook.lerp(new THREE.Vector3(tx, 0, G.pz - v.ahead), 0.08);
  }
  camera.position.copy(camPos); camera.lookAt(camLook);
  drawMap();

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
